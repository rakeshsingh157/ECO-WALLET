<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>ECO Wallet - QR Scanner</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "inverse-on-surface": "#283044",

                        "surface-tint": "#00dce5",
                        "on-surface": "#dae2fd",

                        "error": "#ffb4ab",
                        "on-error-container": "#ffdad6",
                        "on-tertiary": "#00354a",
                        "surface-container-highest": "#2d3449",
                        "surface": "#0b1326",
                        "secondary-fixed-dim": "#bcc7de",
                        "error-container": "#93000a",
                        "tertiary-container": "#b8e3ff",
                        "on-primary-fixed-variant": "#004f53",
                        "primary-fixed": "#63f7ff",
                        "surface-container-lowest": "#060e20",
                        "surface-variant": "#2d3449",
                        "on-error": "#690005",
                        "surface-dim": "#0b1326",
                        "secondary-fixed": "#d8e3fb",
                        "on-background": "#dae2fd",
                        "surface-container-high": "#222a3d",
                        "secondary-container": "#3e495d",
                        "on-secondary": "#263143",
                        "inverse-surface": "#dae2fd",
                        "primary-fixed-dim": "#00dce5",
                        "tertiary-fixed-dim": "#7bd0ff",
                        "outline": "#849495",
                        "on-tertiary-fixed-variant": "#004c69",
                        "surface-bright": "#31394d",
                        "inverse-primary": "#00696e",
                        "background": "#0b1326",
                        "on-secondary-fixed-variant": "#3c475a",
                        "on-primary-container": "#006c71",
                        "outline-variant": "#3a494a",
                        "surface-container-low": "#131b2e",
                        "on-secondary-fixed": "#111c2d",
                        "on-primary-fixed": "#002021",
                        "surface-container": "#171f33",
                        "secondary": "#bcc7de",
                        "on-surface-variant": "#b9caca",
                        "tertiary-fixed": "#c4e7ff"
                    },
                    "borderRadius": {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline": ["Space Grotesk"],
                        "body": ["Inter"],
                        "label": ["Inter"]
                    }
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .scanner-mask {
            background: radial-gradient(circle, transparent 150px, rgba(11, 19, 38, 0.85) 150px);
        }
        .scan-line {
            background: linear-gradient(to bottom, transparent, #00f5ff, transparent);
            height: 2px;
            width: 100%;
            position: absolute;
            top: 0;
            left: 0;
            box-shadow: 0 0 15px #00f5ff;
        }
        @keyframes scan {
            0% { top: 0; }
            100% { top: 100%; }
        }
        .animate-scan {
            animation: scan 3s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface font-body overflow-hidden h-screen w-full flex flex-col">
<!-- Camera Background Placeholder -->
<div class="fixed inset-0 z-0">
<img alt="high-tech digital server room background with glowing circuits and data cables in deep blue and teal lighting" class="w-full h-full object-cover" data-alt="high-tech digital server room background with glowing circuits and data cables in deep blue and teal lighting" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDx2TTYYm9eWzuUVjZNzW849kqpYje9-gXInZfoAVoFxks023ssl8uvsjJaqPhUNSyZ56J9zsE-q-m44VRzS8ZBuXyPPHWI3AHgXwUGjGvuaLgDLLOV19EgdVR9QsZRp-m-IsNr7fiXARbTyZAGFMCu8c2Cm2oh-bTICd_PEFSOuPxseUSSshSrLvu_-wd1EZsZxi_NIpAnNzWzqNR5g4ppb5jYtxx7g6OfhcossUhPeSdCXbc_8VNrBqzE-PSZIsBO3ew8T8KA_4tH"/>
<!-- Darkened Overlay Mask -->
<div class="absolute inset-0 scanner-mask"></div>
</div>
<!-- Top Navigation Anchor (Manual Implementation of TopAppBar Style) -->
<header class="fixed top-0 w-full z-50 flex items-center justify-between px-6 h-16 w-full bg-[#0b1326] backdrop-blur-xl bg-opacity-60">
<div class="flex items-center gap-3">
<div class="w-8 h-8 rounded-full bg-surface-container-high flex items-center justify-center">
<span class="material-symbols-outlined text-primary-container" style="font-size: 18px;">qr_code_scanner</span>
</div>
<h1 class="font-headline text-xl font-bold tracking-widest text-[#00f5ff]">ECO Wallet</h1>
</div>
<button class="w-10 h-10 flex items-center justify-center rounded-full bg-surface-container-highest hover:opacity-80 transition-opacity">
<span class="material-symbols-outlined text-primary-container">flash_on</span>
</button>
</header>
<!-- Main Scanning Canvas -->
<main class="relative flex-1 flex flex-col items-center justify-center z-10">
<!-- Scanning Frame -->
<div class="relative w-[280px] h-[280px] md:w-[320px] md:h-[320px]">
<!-- Corner Brackets -->
<div class="absolute top-0 left-0 w-8 h-8 border-t-4 border-l-4 border-primary-container rounded-tl-xl shadow-[0_0_10px_rgba(0,245,255,0.4)]"></div>
<div class="absolute top-0 right-0 w-8 h-8 border-t-4 border-r-4 border-primary-container rounded-tr-xl shadow-[0_0_10px_rgba(0,245,255,0.4)]"></div>
<div class="absolute bottom-0 left-0 w-8 h-8 border-b-4 border-l-4 border-primary-container rounded-bl-xl shadow-[0_0_10px_rgba(0,245,255,0.4)]"></div>
<div class="absolute bottom-0 right-0 w-8 h-8 border-b-4 border-r-4 border-primary-container rounded-br-xl shadow-[0_0_10px_rgba(0,245,255,0.4)]"></div>
<!-- Animated Scan Line -->
<div class="animate-scan scan-line"></div>
<!-- Subtle Inner Glow -->
<div class="absolute inset-4 border border-primary-container/10 rounded-lg"></div>
</div>
<!-- Instructional Content -->
<div class="mt-12 px-8 text-center max-w-sm">
<p class="text-primary font-headline text-lg font-medium mb-2">Ready to Scan</p>
<p class="text-on-surface-variant font-body text-sm leading-relaxed">
                Align QR code within the frame to automatically detect the wallet address or transaction details.
            </p>
</div>
</main>
<!-- Bottom Controls & Navigation -->
<footer class="fixed bottom-0 w-full z-50 flex flex-col items-center gap-6 pb-12 pt-8">
<!-- Secondary Action (Close) -->
<button class="bg-surface-container-highest text-primary font-label text-[12px] font-bold uppercase tracking-[2px] px-8 py-3 rounded-full hover:bg-surface-bright transition-colors active:scale-95 duration-200">
            Close Scanner
        </button>
<!-- Quick Access / Info Card -->
<div class="w-[90%] max-w-md bg-surface-container-low backdrop-blur-md bg-opacity-80 rounded-lg p-4 flex items-center justify-between shadow-[0_20px_40px_rgba(0,220,225,0.06)]">
<div class="flex items-center gap-4">
<div class="w-12 h-12 bg-gradient-to-br from-[#00f5ff] to-[#006c71] rounded-full flex items-center justify-center text-surface shadow-lg">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">account_balance_wallet</span>
</div>
<div>
<p class="text-on-surface-variant text-[10px] font-bold uppercase tracking-widest">Active Wallet</p>
<p class="text-primary font-headline font-medium">Main Ether Node</p>
</div>
</div>
<div class="text-right">
<p class="text-on-surface-variant text-[10px] font-bold uppercase tracking-widest">Balance</p>
<p class="text-primary-container font-headline font-bold">1.428 ETH</p>
</div>
</div>
<!-- Bottom Navigation Shell (Consistent with Shared JSON structure) -->
<nav class="hidden md:flex justify-around items-center px-4 pb-6 pt-2 w-full max-w-2xl bg-[#0b1326] backdrop-blur-xl bg-opacity-60 rounded-t-[32px] shadow-[0_-20px_40px_rgba(0,220,225,0.06)] mt-4">
<div class="flex flex-col items-center justify-center text-[#b9caca] p-3 hover:text-[#00f5ff] transition-colors cursor-pointer">
<span class="material-symbols-outlined">home_app_logo</span>
<span class="font-label text-[10px] font-bold uppercase tracking-[2px] mt-1">Home</span>
</div>
<div class="flex flex-col items-center justify-center text-[#b9caca] p-3 hover:text-[#00f5ff] transition-colors cursor-pointer">
<span class="material-symbols-outlined">history</span>
<span class="font-label text-[10px] font-bold uppercase tracking-[2px] mt-1">History</span>
</div>
<div class="flex flex-col items-center justify-center text-[#b9caca] p-3 hover:text-[#00f5ff] transition-colors cursor-pointer">
<span class="material-symbols-outlined">workspace_premium</span>
<span class="font-label text-[10px] font-bold uppercase tracking-[2px] mt-1">Rewards</span>
</div>
<div class="flex flex-col items-center justify-center text-[#b9caca] p-3 hover:text-[#00f5ff] transition-colors cursor-pointer">
<span class="material-symbols-outlined">person</span>
<span class="font-label text-[10px] font-bold uppercase tracking-[2px] mt-1">Profile</span>
</div>
</nav>
</footer>
<!-- Focused Action Indicator (Mobile Floating View) -->
<div class="fixed bottom-10 left-1/2 -translate-x-1/2 md:hidden z-50">
<div class="w-16 h-1 w-8 rounded-full bg-primary-container opacity-20"></div>
</div>
</body></html>
