<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Vyapaar Helper - Sign Up</title>

                        "secondary": "#a04100",

                        "primary": "#006565",
                        "tertiary-fixed-dim": "#ffb692",
                        "inverse-on-surface": "#edf2f1",
                        "on-secondary-container": "#5e2300",
                        "surface-container-high": "#e5e9e8",
                        "on-error": "#ffffff",
                        "error-container": "#ffdad6",
                        "tertiary": "#8b4823",
                        "secondary-fixed-dim": "#ffb693",
                        "on-primary-fixed": "#002020",
                        "background": "#f6faf9",

                        "on-primary-fixed-variant": "#004f4f",
                        "secondary-container": "#fd7729",

                        "inverse-surface": "#2c3131",
                        "on-error-container": "#93000a",
                        "surface-dim": "#d7dbda",
                        "on-surface-variant": "#3e4949",

                        "surface-container-low": "#f0f4f3"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",

                    },
                    "spacing": {
                        "gutter": "16px",
                        "margin-desktop": "48px",
                        "sm": "8px",
                        "unit": "4px",
                        "xl": "32px",

                        "xs": "4px"
                    },
                    "fontFamily": {

                        "display-lg": ["Quicksand"],
                        "body-md": ["Quicksand"],

<style>
        body { font-family: 'Quicksand', sans-serif; }
        .press-in:active { transform: translateY(1px); box-shadow: none; }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col items-center justify-center p-margin-mobile relative overflow-hidden">
<!-- Mascot Peeking -->
<div class="fixed bottom-0 right-0 w-32 md:w-48 translate-y-4 md:translate-y-8 z-0">
<img alt="Friendly shopkeeper mascot smiling warmly, illustrative vector style with teal brand colors, high quality, engaging character design." class="w-full h-auto object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuD9bIrW4aFQTuvAoL0gncruUmdMrP7DmvZ71YwlW_iminQekfJWcs8sgqcvtcJ_Hy3TeKz3ei3yLRpCoxUJEurRsKNViLNSkUqCANX4GTNfKeSQ_HYievFGHTbTrscDIeCxw5GB3yoQ5Vx1C6SSpm7MHorJrlvbHMNlY1Xmb0_4yTL6a_NrhO23Trki_R4da36Ys6Lt9ssZobHq5MABKj81MpD8fouE0VK-jsnkO0QlAaqiVpBROEctSw"/>
</div>
<!-- Main Card -->
<main class="w-full max-w-md bg-surface-container-lowest rounded-xl shadow-sm border border-surface-container-highest p-xl relative z-10">
<div class="text-center mb-xl">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary mb-sm">Welcome to Vyapaar Helper</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Let's set up your shop in seconds.</p>
</div>
<form class="space-y-lg">
<!-- Shop Name -->
<div class="relative">
<input class="block w-full px-md pb-2 pt-6 bg-surface-container-low border-b-2 border-surface-variant rounded-t-lg text-on-surface focus:outline-none focus:border-primary focus:bg-surface-container-lowest transition-colors peer" id="shopName" name="shopName" placeholder=" " required="" type="text"/>
<label class="absolute text-on-surface-variant duration-300 transform -translate-y-4 scale-75 top-4 z-10 origin-[0] left-md peer-placeholder-shown:scale-100 peer-placeholder-shown:translate-y-0 peer-focus:scale-75 peer-focus:-translate-y-4 font-body-md text-body-md" for="shopName">
                    Shop Name
                </label>
</div>
<!-- Owner Name -->
<div class="relative">
<input class="block w-full px-md pb-2 pt-6 bg-surface-container-low border-b-2 border-surface-variant rounded-t-lg text-on-surface focus:outline-none focus:border-primary focus:bg-surface-container-lowest transition-colors peer" id="ownerName" name="ownerName" placeholder=" " required="" type="text"/>
<label class="absolute text-on-surface-variant duration-300 transform -translate-y-4 scale-75 top-4 z-10 origin-[0] left-md peer-placeholder-shown:scale-100 peer-placeholder-shown:translate-y-0 peer-focus:scale-75 peer-focus:-translate-y-4 font-body-md text-body-md" for="ownerName">
                    Owner Name
                </label>
</div>
<!-- Mobile Number -->
<div class="relative">
<input class="block w-full px-md pb-2 pt-6 bg-surface-container-low border-b-2 border-surface-variant rounded-t-lg text-on-surface focus:outline-none focus:border-primary focus:bg-surface-container-lowest transition-colors peer" id="mobileNumber" name="mobileNumber" pattern="[0-9]{10}" placeholder=" " required="" type="tel"/>
<label class="absolute text-on-surface-variant duration-300 transform -translate-y-4 scale-75 top-4 z-10 origin-[0] left-md peer-placeholder-shown:scale-100 peer-placeholder-shown:translate-y-0 peer-focus:scale-75 peer-focus:-translate-y-4 font-body-md text-body-md" for="mobileNumber">
                    Mobile Number
                </label>
</div>
<!-- PIN -->
<div class="relative">
<input class="block w-full px-md pb-2 pt-6 bg-surface-container-low border-b-2 border-surface-variant rounded-t-lg text-on-surface focus:outline-none focus:border-primary focus:bg-surface-container-lowest transition-colors peer" id="pin" name="pin" pattern="[0-9]{4,6}" placeholder=" " required="" type="password"/>
<label class="absolute text-on-surface-variant duration-300 transform -translate-y-4 scale-75 top-4 z-10 origin-[0] left-md peer-placeholder-shown:scale-100 peer-placeholder-shown:translate-y-0 peer-focus:scale-75 peer-focus:-translate-y-4 font-body-md text-body-md" for="pin">
                    Create Security PIN (4-6 digits)
                </label>
</div>
<div class="pt-sm">
<button class="w-full bg-primary text-on-primary font-label-md text-label-md py-md rounded-lg shadow-sm hover:bg-primary-container hover:text-on-primary-container transition-colors press-in duration-100 flex items-center justify-center gap-sm" type="submit">
<span>Create Account</span>
<span class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
<p class="text-center font-caption text-caption text-on-surface-variant mt-md">
                Already have an account? <a class="text-primary font-bold hover:underline" href="#">Log in</a>
</p>
</form>
</main>
</body></html>
