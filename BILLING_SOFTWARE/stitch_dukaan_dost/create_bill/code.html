<body class="font-body-md text-on-background min-h-screen pb-32">
<!-- TopAppBar (Hidden on strictly mobile layout as requested by prompt focus, but included per JSON instructions if it's a top-level dest. However, billing is usually a transactional screen, but the prompt implies it's a main screen with BottomNavBar. We'll show both for compliance with the "Destination" rule if we consider Billing a primary tab.) -->
<header class="hidden md:flex flex-row justify-between items-center px-margin-mobile py-sm w-full top-0 sticky bg-surface border-b border-outline-variant shadow-sm z-40">
<div class="flex items-center gap-sm">
<span class="material-symbols-outlined text-primary font-bold text-headline-md">storefront</span>
<span class="font-headline-md text-headline-md text-primary font-bold">Vyapaar Helper</span>
</div>
<div class="flex items-center gap-gutter">
<button class="p-2 hover:bg-surface-variant transition-colors rounded-full text-on-surface-variant"><span class="material-symbols-outlined">notifications</span></button>
<div class="w-8 h-8 rounded-full bg-primary-container flex items-center justify-center text-on-primary-container font-bold">SM</div>
</div>
</header>
<!-- Main Content Area for Billing -->
<main class="max-w-3xl mx-auto md:mt-lg px-margin-mobile pt-sm md:pt-0">
<!-- Search & Scan Section -->
<div class="flex gap-sm mb-lg">
<div class="relative flex-1 group">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary">search</span>
<input class="w-full pl-10 pr-4 py-3 bg-[#F3F2EE] focus:bg-surface-container-lowest border-transparent focus:border-primary rounded-lg font-body-md text-on-surface outline-none transition-all shadow-sm" placeholder="Search by name or code..." type="text"/>
</div>
<button class="bg-primary text-on-primary rounded-lg p-3 shadow-sm press-in flex items-center justify-center">
<span class="material-symbols-outlined">barcode_scanner</span>
</button>
</div>
<!-- Fast Moving Products (Bento Grid Style) -->
<h2 class="font-title-lg text-title-lg mb-sm text-on-surface">Fast Moving Items</h2>
<div class="grid grid-cols-2 md:grid-cols-4 gap-sm mb-xl">
<!-- Item 1 -->
<button class="bg-surface-container-lowest border border-[#EAE8E0] rounded-xl p-md flex flex-col items-center justify-center gap-xs shadow-[0_4px_12px_rgba(0,0,0,0.03)] press-in hover:border-primary-container transition-colors relative overflow-hidden group">
<div class="absolute inset-0 bg-primary/5 opacity-0 group-active:opacity-100 transition-opacity"></div>
<div class="w-12 h-12 bg-secondary-container/20 rounded-full flex items-center justify-center mb-1">
<span class="material-symbols-outlined text-secondary-container text-2xl">local_cafe</span>
</div>
<span class="font-label-md text-label-md text-on-surface text-center">Chai Pack</span>
<span class="font-caption text-caption text-primary">₹120.00</span>
</button>

<button class="bg-surface-container-lowest border border-[#EAE8E0] rounded-xl p-md flex flex-col items-center justify-center gap-xs shadow-[0_4px_12px_rgba(0,0,0,0.03)] press-in hover:border-primary-container transition-colors relative overflow-hidden group">
<div class="absolute inset-0 bg-primary/5 opacity-0 group-active:opacity-100 transition-opacity"></div>
<div class="w-12 h-12 bg-tertiary-container/20 rounded-full flex items-center justify-center mb-1">
<span class="material-symbols-outlined text-tertiary-container text-2xl">cookie</span>
</div>
<span class="font-label-md text-label-md text-on-surface text-center">Biscuits XL</span>
<span class="font-caption text-caption text-primary">₹80.00</span>
</button>

<div class="absolute inset-0 bg-primary/5 opacity-0 group-active:opacity-100 transition-opacity"></div>
<div class="w-12 h-12 bg-primary-container/20 rounded-full flex items-center justify-center mb-1">

<span class="font-caption text-caption text-primary">₹45.00</span>
</button>
</div>

<div class="p-md bg-surface-container-low border-b border-[#F3F2EE] flex justify-between items-center">

<button class="text-error font-label-md text-label-md p-1 hover:bg-error-container/20 rounded">Clear All</button>

<div class="flex flex-col">

</div>
</div>

<div class="flex items-center gap-sm">
<span class="font-body-md text-body-md text-[#5f7a60]">+ ₹130.00</span>

<span class="material-symbols-outlined text-sm">remove</span>

</div>
</div>

</div>
<button class="bg-primary text-on-primary font-title-lg text-title-lg px-xl py-sm rounded-lg press-in shadow-sm flex items-center gap-2">
                Checkout <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">arrow_forward</span>

<span class="font-label-md text-label-md">Home</span>

<a class="flex flex-col items-center justify-center text-on-surface-variant p-2 hover:bg-surface-container-high transition-all scale-95 duration-75 ease-out" href="#">

<span class="font-label-md text-label-md">Inventory</span>
</a>
<a class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-xl px-4 py-1 hover:bg-surface-container-high transition-all scale-95 duration-75 ease-out" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">receipt_long</span>
<span class="font-label-md text-label-md font-bold text-primary">Billing</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant p-2 hover:bg-surface-container-high transition-all scale-95 duration-75 ease-out" href="#">
<span class="material-symbols-outlined">bar_chart</span>
