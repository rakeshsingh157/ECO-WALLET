<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Bill Success - Vyapaar Helper</title>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "tertiary-fixed": "#ffdbcb",
                      "on-tertiary-container": "#fff9f7",
                      "primary-fixed": "#93f2f2",
                      "on-primary": "#ffffff",
                      "on-secondary": "#ffffff",
                      "surface": "#f6faf9",
                      "on-tertiary": "#ffffff",
                      "on-primary-container": "#e3fffe",
                      "surface-container": "#ebefee",
                      "surface-container-highest": "#dfe3e2",
                      "outline": "#6e7979",
                      "surface-bright": "#f6faf9",
                      "outline-variant": "#bdc9c8",
                      "secondary-fixed": "#ffdbcc",
                      "tertiary-container": "#a96039",
                      "error": "#ba1a1a",
                      "on-secondary-fixed": "#351000",
                      "secondary": "#a04100",
                      "surface-variant": "#dfe3e2",
                      "on-background": "#181c1c",
                      "surface-tint": "#006a6a",
                      "inverse-primary": "#76d6d5",
                      "primary-container": "#008080",
                      "surface-container-lowest": "#ffffff",
                      "on-tertiary-fixed-variant": "#733512",
                      "primary": "#006565",
                      "tertiary-fixed-dim": "#ffb692",
                      "inverse-on-surface": "#edf2f1",
                      "on-secondary-container": "#5e2300",
                      "surface-container-high": "#e5e9e8",
                      "on-error": "#ffffff",
                      "error-container": "#ffdad6",
                      "tertiary": "#8b4823",
                      "secondary-fixed-dim": "#ffb693",
                      "on-primary-fixed": "#002020",
                      "background": "#f6faf9",
                      "primary-fixed-dim": "#76d6d5",
                      "on-secondary-fixed-variant": "#7a3000",
                      "on-primary-fixed-variant": "#004f4f",
                      "secondary-container": "#fd7729",
                      "on-tertiary-fixed": "#341100",
                      "inverse-surface": "#2c3131",
                      "on-error-container": "#93000a",
                      "surface-dim": "#d7dbda",
                      "on-surface-variant": "#3e4949",
                      "on-surface": "#181c1c",
                      "surface-container-low": "#f0f4f3"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "spacing": {
                      "gutter": "16px",
                      "margin-desktop": "48px",
                      "sm": "8px",
                      "unit": "4px",
                      "xl": "32px",
                      "md": "16px",
                      "lg": "24px",
                      "margin-mobile": "16px",
                      "xs": "4px"
              },
              "fontFamily": {
                      "caption": ["Quicksand"],
                      "display-lg": ["Quicksand"],
                      "body-md": ["Quicksand"],
                      "body-lg": ["Quicksand"],
                      "headline-lg": ["Quicksand"],
                      "headline-md": ["Quicksand"],
                      "label-md": ["Quicksand"],
                      "headline-lg-mobile": ["Quicksand"],
                      "title-lg": ["Quicksand"]
              },
              "fontSize": {
                      "caption": ["12px", {"lineHeight": "16px", "fontWeight": "500"}],
                      "display-lg": ["40px", {"lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                      "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "500"}],
                      "body-lg": ["18px", {"lineHeight": "26px", "fontWeight": "500"}],
                      "headline-lg": ["32px", {"lineHeight": "40px", "fontWeight": "700"}],
                      "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                      "label-md": ["14px", {"lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "600"}],
                      "headline-lg-mobile": ["24px", {"lineHeight": "32px", "fontWeight": "700"}],
                      "title-lg": ["20px", {"lineHeight": "28px", "fontWeight": "600"}]
              }
            }
          }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined.fill-icon {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .press-in:active {
            transform: translateY(1px);
            box-shadow: none !important;
        }
        
        /* Celebration Animation */
        @keyframes pop {
            0% { transform: scale(0.8); opacity: 0; }
            70% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-pop {
            animation: pop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
        .animate-float {
            animation: float 3s ease-in-out infinite;
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md overflow-x-hidden">
<!-- Top Navigation omitted as this is a transactional/success screen -->
<header class="w-full flex items-center justify-start p-margin-mobile bg-transparent absolute top-0 z-10">
<button aria-label="Close" class="p-2 rounded-full hover:bg-surface-variant transition-colors press-in">
<span class="material-symbols-outlined text-on-surface">close</span>
</button>
</header>
<main class="flex-grow flex flex-col items-center justify-center p-margin-mobile pt-xl pb-xl max-w-md mx-auto w-full relative z-0">
<!-- Celebration Area -->
<div class="mb-lg relative w-full flex justify-center mt-xl">
<!-- Central Mascot -->
<div class="relative z-10 animate-float w-40 h-40 flex items-center justify-center">
<img alt="Vyapaar Helper Mascot celebrating" class="w-full h-full object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCXDAfrTHGnEKxLlmxeqPc5R4druVkys3DPFLd_ze_anbdqHKx306DcS4ql6SaCKjfmNIOvs5LVCdHlpMa3ZvLcdqwNkIbTFTtZGUygY1-ue1e6M5OTWwQf8lAt3xqrWYz42kYATg8Rf5C2olRxw2DeSTYh1Sjb0-iW9h6jA-jAScA3pdDG2CorPzOgkbn15KVKtmYp_hcwmCS4RxxcOTXwd63U_XluOR5u7I40AlSpfaQNsbPKCX7W5Q"/>
</div>
<!-- Confetti / Success Indicator behind mascot -->
<div class="absolute inset-0 flex items-center justify-center pointer-events-none z-0">
<div class="w-32 h-32 bg-primary-container rounded-full opacity-20 animate-ping" style="animation-duration: 2s;"></div>
</div>
<!-- Large Checkmark -->
<div class="absolute -bottom-4 right-1/4 z-20 bg-surface rounded-full p-1 shadow-md animate-pop" style="animation-delay: 0.3s; opacity: 0;">
<div class="bg-primary rounded-full w-12 h-12 flex items-center justify-center">
<span class="material-symbols-outlined text-on-primary text-3xl font-bold">check</span>
</div>
</div>
</div>
<!-- Success Message -->
<div class="text-center mb-xl animate-pop" style="animation-delay: 0.1s; opacity: 0;">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-background mb-sm">Bill Paid Successfully!</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Great job! The payment has been recorded.</p>
</div>
<!-- Receipt Card (Bento/Glass style) -->
<div class="w-full bg-surface-container-lowest border border-outline-variant shadow-[0px_4px_12px_rgba(0,0,0,0.03)] rounded-xl p-md mb-xl relative animate-pop" style="animation-delay: 0.2s; opacity: 0;">
<!-- Receipt jagged edge effect using pseudo elements -->
<div class="absolute -top-1 left-0 w-full h-2 bg-[radial-gradient(circle_at_50%_0,transparent_2px,#ffffff_3px)] bg-[length:12px_8px] repeat-x z-10"></div>
<div class="flex justify-between items-center border-b border-surface-container-highest pb-md mb-md">
<div>
<p class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider">Bill Amount</p>
<p class="font-headline-lg-mobile text-headline-lg-mobile text-primary font-bold mt-unit">₹450.00</p>
</div>
<div class="bg-tertiary-fixed text-on-tertiary-fixed px-3 py-1 rounded-full font-label-md text-label-md flex items-center gap-1">
<span class="material-symbols-outlined text-sm">payments</span>
                    Cash
                </div>
</div>
<div class="space-y-sm">
<div class="flex justify-between items-center">
<span class="font-body-md text-body-md text-on-surface-variant">Bill Number</span>
<span class="font-title-lg text-title-lg text-on-background">#1024</span>
</div>
<div class="flex justify-between items-center">
<span class="font-body-md text-body-md text-on-surface-variant">Date</span>
<span class="font-body-md text-body-md text-on-background">Today, 2:30 PM</span>
</div>
</div>
<!-- Bottom jagged edge -->
<div class="absolute -bottom-1 left-0 w-full h-2 bg-[radial-gradient(circle_at_50%_100%,transparent_2px,#ffffff_3px)] bg-[length:12px_8px] repeat-x z-10"></div>
</div>
<!-- Action Buttons -->
<div class="w-full space-y-md animate-pop" style="animation-delay: 0.4s; opacity: 0;">
<!-- Primary Action: WhatsApp Share -->
<button class="w-full bg-[#25D366] hover:bg-[#1EBE5D] text-white rounded-lg py-3 px-md flex items-center justify-center gap-2 font-title-lg text-title-lg shadow-sm transition-colors press-in">
<!-- Using a generic share icon as custom brand icons might not be available, styled to look like WA -->
<span class="material-symbols-outlined">share</span>
                Share on WhatsApp
            </button>
<!-- Secondary Actions Row -->
<div class="flex gap-md w-full">
<button class="flex-1 bg-surface-container-lowest border border-primary text-primary hover:bg-surface-container-low rounded-lg py-2 px-sm flex flex-col items-center justify-center gap-1 font-label-md text-label-md transition-colors press-in shadow-sm">
<span class="material-symbols-outlined text-xl">print</span>
                    Print Bill
                </button>
<button class="flex-1 bg-surface-container-lowest border border-primary text-primary hover:bg-surface-container-low rounded-lg py-2 px-sm flex flex-col items-center justify-center gap-1 font-label-md text-label-md transition-colors press-in shadow-sm">
<span class="material-symbols-outlined text-xl">download</span>
                    Download PDF
                </button>
</div>
</div>
<!-- Bottom Action Zone - Back to Home -->
<div class="mt-xl w-full animate-pop" style="animation-delay: 0.5s; opacity: 0;">
<button class="w-full bg-surface-container text-on-surface-variant hover:bg-surface-container-high rounded-lg py-3 px-md flex items-center justify-center gap-2 font-title-lg text-title-lg transition-colors press-in border border-outline-variant">
                Back to Home
            </button>
</div>
</main>
<!-- Bottom Navigation suppressed due to semantic rules (Linear/Transactional Success screen) -->
</body></html>
