name: dukaan_dost
description: Dukaan Dost - Smart Billing for Smart Shopkeepers
publish_to: 'none'
version: 1.0.5+6

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.1
  shared_preferences: ^2.2.3
  provider: ^6.1.2
  qr_flutter: ^4.1.0
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  intl: ^0.19.0
  shimmer: ^3.0.0
  uuid: ^4.4.2
  share_plus: ^10.0.0
  mobile_scanner: ^5.2.3
  image_picker: ^1.2.3
  pdf: ^3.11.1
  printing: ^5.13.2
  path_provider: ^2.1.3
  speech_to_text: ^7.0.0
  record: ^5.2.0
  audioplayers: ^6.1.0
  dio: ^5.9.2
  open_filex: ^4.7.0
  package_info_plus: ^9.0.1
  permission_handler: ^12.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

dependency_overrides:
  record_linux: ^1.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/mascots/

flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0A0D14"
  adaptive_icon_foreground: "assets/images/app_icon.png"
