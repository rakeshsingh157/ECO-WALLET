name: eco_wallet
description: ECO Wallet - Secure Closed Digital Wallet Ecosystem
publish_to: 'none'
version: 1.0.7

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.1
  shared_preferences: ^2.2.3
  provider: ^6.1.2
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.3
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  intl: ^0.19.0
  pin_code_fields: ^8.0.1
  shimmer: ^3.0.0
  fl_chart: ^0.68.0
  uuid: ^4.4.2
  google_mobile_ads: ^7.0.0
  share_plus: ^12.0.2
  path_provider: ^2.1.5
  image_picker: ^1.2.1
  firebase_core: ^4.6.0
  firebase_messaging: ^16.1.3
  flutter_local_notifications: ^17.2.4
  dio: ^5.9.2
  open_filex: ^4.7.0
  package_info_plus: ^9.0.1
  permission_handler: ^12.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/icon.png"
